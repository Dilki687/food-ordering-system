name: Payment Service CI/CD

on:
  push:
    branches: [main, payment_Susara]
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-service.yml"

jobs:
  # ─────────────────────────────────────────────────
  # 1. TEST
  # ─────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-service

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: payment-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test
        env:
          STRIPE_SECRET_KEY: sk_test_dummy_key_for_ci
          USER_SERVICE_URL: https://user-identity-service.onrender.com
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: payment-service/coverage/

  # ─────────────────────────────────────────────────
  # 2. SAST — Snyk Security Scan (DevSecOps)
  # ─────────────────────────────────────────────────
  snyk:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true   # won't block pipeline on findings, but reports them
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

  # ─────────────────────────────────────────────────
  # 3. BUILD & PUSH Docker image (main branch only)
  # ─────────────────────────────────────────────────
  build:
    needs: [test, snyk]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/payment-service
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

  # ─────────────────────────────────────────────────
  # 4. DEPLOY to Railway
  # ─────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway via API
        run: |
          # Step 1: Get environment ID
          ENV_RESPONSE=$(curl -sf -X POST "https://backboard.railway.com/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ project(id: \"ba4412f7-ec82-4931-a3e8-608df1b959e6\") { environments { edges { node { id name } } } } }"}')
          echo "Environments: $ENV_RESPONSE"
          ENV_ID=$(echo "$ENV_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['project']['environments']['edges'][0]['node']['id'])")
          echo "Environment ID: $ENV_ID"

          # Step 2: Update Railway service to use the new SHA-tagged image (forces image pull)
          # Use short SHA to match what docker/metadata-action generates (sha-<7chars>)
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/payment-service:sha-${SHORT_SHA}"
          echo "Updating Railway service image to: $IMAGE_TAG"
          UPDATE=$(curl -s -X POST "https://backboard.railway.com/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceUpdate(input: { serviceId: \\\"af970fd3-7ca2-46c5-95db-f221fa824281\\\", environmentId: \\\"$ENV_ID\\\", source: { image: \\\"$IMAGE_TAG\\\" } }) }\"}")
          echo "Update response: $UPDATE"

          # Step 3: Ensure ORDER_SERVICE_URL env var is set in Railway
          curl -s -X POST "https://backboard.railway.com/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { variableUpsert(input: { projectId: \\\"ba4412f7-ec82-4931-a3e8-608df1b959e6\\\", environmentId: \\\"$ENV_ID\\\", serviceId: \\\"af970fd3-7ca2-46c5-95db-f221fa824281\\\", name: \\\"ORDER_SERVICE_URL\\\", value: \\\"https://order-service-production-5615.up.railway.app\\\" }) }\"}" || true
          echo "ORDER_SERVICE_URL variable upserted"

          # Step 4: Trigger deployment with the new image
          DEPLOY=$(curl -sf -X POST "https://backboard.railway.com/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { environmentTriggersDeploy(input: { projectId: \\\"ba4412f7-ec82-4931-a3e8-608df1b959e6\\\", serviceId: \\\"af970fd3-7ca2-46c5-95db-f221fa824281\\\", environmentId: \\\"$ENV_ID\\\" }) }\"}")
          echo "Deploy response: $DEPLOY"

          echo "$DEPLOY" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(1 if 'errors' in d else 0)"
          echo "Deployment triggered successfully with image $IMAGE_TAG"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
