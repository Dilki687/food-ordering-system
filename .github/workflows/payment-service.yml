name: Payment Service CI/CD

on:
  push:
    branches: [main, payment_Susara]
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-service.yml"

jobs:
  # ─────────────────────────────────────────────────
  # 1. TEST
  # ─────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-service

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: payment-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test
        env:
          STRIPE_SECRET_KEY: sk_test_dummy_key_for_ci
          USER_SERVICE_URL: https://user-identity-service.onrender.com
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: payment-service/coverage/

  # ─────────────────────────────────────────────────
  # 2. SAST — Snyk Security Scan (DevSecOps)
  # ─────────────────────────────────────────────────
  snyk:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true   # won't block pipeline on findings, but reports them
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

  # ─────────────────────────────────────────────────
  # 3. BUILD & PUSH Docker image (main branch only)
  # ─────────────────────────────────────────────────
  build:
    needs: [test, snyk]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/payment-service
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────
  # 4. DEPLOY to Railway
  # ─────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          # Deploy the Docker image we just pushed to Docker Hub
          railway deploy \
            --image ${{ secrets.DOCKER_USERNAME }}/payment-service:latest \
            --service af970fd3-7ca2-46c5-95db-f221fa824281 \
            --environment production \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ba4412f7-ec82-4931-a3e8-608df1b959e6
